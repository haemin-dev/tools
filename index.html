<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해민로그 웹툴 모음</title>
<meta name="description" content="일본 생활과 공부에 쓰는 작은 웹툴 모음. 일본 알바 연봉의 벽 계산기 등 설치 없이 바로 쓰는 도구들입니다.">
<meta name="theme-color" content="#FBF4DE">
<link rel="canonical" href="https://haemin-dev.github.io/tools/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#FBF4DE;color:#23486A;font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
::selection{background:#F7E39C}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px 64px}
h1{margin:0;font-size:1.75rem;line-height:1.3}
.lead{margin:8px 0 24px;color:#4F6B85}
ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
a.tool{display:block;padding:20px;background:#fff;border:1.5px dashed #A9C6DE;border-radius:18px;color:inherit;text-decoration:none;box-shadow:0 2px 12px rgba(35,72,106,.06);transition:transform 180ms cubic-bezier(0.23,1,0.32,1),border-color 160ms ease}
a.tool:active{transform:scale(.99)}
a.tool:focus-visible{outline:2px solid #23486A;outline-offset:3px}
a.tool h2{margin:0;font-size:1.1875rem;line-height:1.4}
a.tool p{margin:6px 0 0;font-size:.9375rem;color:#4F6B85}
.tag{display:inline-block;margin-top:12px;padding:3px 12px;border-radius:999px;background:#F7E39C;border:1px dashed #23486A;font-size:.8125rem;font-weight:700}
@media (hover:hover) and (pointer:fine){a.tool:hover{transform:translateY(-2px);border-color:#23486A}}
@media (prefers-reduced-motion:reduce){a.tool{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1>해민로그 웹툴 모음</h1>
  <p class="lead">설치 없이 바로 쓰는 작은 도구들이에요.</p>
  <ul>
    <li>
      <a class="tool" href="arubaito-kabe/">
        <h2>일본 알바 연봉의 벽 계산기</h2>
        <p>시급과 근무시간을 넣으면 130만 · 136만 · 178만 엔의 벽까지 남은 금액과 일할 수 있는 시간을 바로 계산해요.</p>
        <span class="tag">한국어 · 日本語</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
